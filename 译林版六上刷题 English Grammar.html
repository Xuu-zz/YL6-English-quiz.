<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#F7F3EC">
<title>译林六上 · 英语练习台</title>
<style>:root{
  --paper:#F7F3EC; --card:#FFFFFF; --ink:#1A1713; --ink2:#544E45; --ink3:#8B8375;
  --line:#E7DFD2; --line2:#D8CFBF;
  --accent:#0C6A57; --accent-ink:#0A5B4A; --accent-soft:#E7F1EE;
  --gold:#A06E22; --gold-soft:#F8EEDB;
  --ok:#177A4F; --ok-soft:#E7F3EC;
  --bad:#AE3524; --bad-soft:#FAEAE6;
  --r:16px; --r-sm:10px;
  --shadow:0 1px 0 rgba(26,23,19,.03), 0 10px 24px -20px rgba(26,23,19,.45);
  --en:"Iowan Old Style","Palatino Linotype",Palatino,Georgia,"Times New Roman",serif;
  --zh:"PingFang SC","Microsoft YaHei","Noto Sans SC",system-ui,-apple-system,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:var(--paper); color:var(--ink); font-family:var(--zh);
  font-size:16px; line-height:1.6; -webkit-font-smoothing:antialiased;
  -webkit-text-size-adjust:100%;
}
button{font-family:inherit;font-size:inherit;color:inherit}
.app{max-width:760px;margin:0 auto;padding:0 16px 96px;min-height:100vh}

/* ---------- 顶部 ---------- */
header.top{
  position:sticky;top:0;z-index:20;background:var(--paper);
  padding:14px 0 10px;border-bottom:1px solid var(--line);
  display:flex;align-items:flex-end;justify-content:space-between;gap:12px;
}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}
.kicker{font-size:11px;letter-spacing:.14em;color:var(--ink3);text-transform:uppercase}
.brand h1{font-size:19px;margin:0;font-weight:700;letter-spacing:.01em}
.brand h1 small{font-weight:500;color:var(--ink3);font-size:12px;margin-left:6px;letter-spacing:0}
.top-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
.chip{
  font-size:11.5px;padding:4px 9px;border:1px solid var(--line2);border-radius:999px;
  color:var(--ink2);background:var(--card);white-space:nowrap
}
.chip.accent{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}

/* ---------- 通用 ---------- */
h2.sec{font-size:13px;letter-spacing:.08em;color:var(--ink3);font-weight:600;margin:26px 0 10px;text-transform:uppercase}
p{margin:.5em 0}
.muted{color:var(--ink3)}
.small{font-size:13px}
.tiny{font-size:12px}
hr.rule{border:0;border-top:1px solid var(--line);margin:18px 0}

.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow)}
.panel + .panel{margin-top:12px}
.panel h3{margin:0 0 8px;font-size:15px}
.panel h3 .num{font-family:var(--en);color:var(--accent);margin-right:6px}

.rowlist{background:var(--card);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.row{
  display:flex;align-items:center;gap:14px;padding:13px 14px;width:100%;
  background:none;border:0;border-bottom:1px solid var(--line);text-align:left;cursor:pointer;
}
.row:last-child{border-bottom:0}
.row:hover{background:#FBF8F2}
.row:active{background:#F5F0E7}
.row .idx{
  font-family:var(--en);font-size:17px;font-weight:600;color:var(--accent);
  width:38px;flex-shrink:0;letter-spacing:.02em
}
.row .mid{flex:1;min-width:0}
.row .t{font-weight:600;font-size:15.5px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .s{font-size:12.5px;color:var(--ink3);display:block;margin-top:1px}
.clamp2{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:normal!important}
.row .arrow{color:var(--ink3);font-size:18px;flex-shrink:0}
.meter{height:3px;background:var(--line);border-radius:2px;margin-top:7px;overflow:hidden}
.meter i{display:block;height:100%;background:var(--accent);border-radius:2px}

.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--accent);
  background:var(--accent);color:#fff;font-weight:600;cursor:pointer;letter-spacing:.01em
}
.btn:active{transform:translateY(1px)}
.btn.ghost{background:var(--card);color:var(--accent);border-color:var(--line2)}
.btn.ghost:hover{border-color:var(--accent)}
.btn.plain{background:none;border:0;color:var(--ink2);text-decoration:underline;padding:0 4px;min-height:32px}
.btn.sm{min-height:38px;padding:0 14px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.45;cursor:default}
.btnrow{display:flex;gap:10px;flex-wrap:wrap}

/* ---------- 今日 ---------- */
.today{
  display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);
  border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-top:14px
}
.today div{background:var(--card);padding:13px 14px}
.today .k{font-size:11.5px;color:var(--ink3);letter-spacing:.04em}
.today .v{font-family:var(--en);font-size:24px;font-weight:600;line-height:1.25;margin-top:2px}
.today .v span{font-family:var(--zh);font-size:12px;font-weight:400;color:var(--ink3);margin-left:3px}

.hero-note{
  margin-top:14px;padding:14px 16px;border:1px dashed var(--line2);border-radius:var(--r);
  background:#FCFAF5;font-size:13.5px;color:var(--ink2)
}
.hero-note b{color:var(--ink)}

/* ---------- 单元头 ---------- */
.unithead{display:flex;gap:14px;align-items:flex-start;margin:16px 0 6px}
.unithead .no{font-family:var(--en);font-size:34px;line-height:1;color:var(--accent);font-weight:600}
.unithead h2{margin:0;font-size:21px;line-height:1.25}
.unithead .cn{color:var(--ink3);font-size:13px;margin-top:2px}
.unithead .cn b{color:var(--ink2);font-weight:500}

/* ---------- Tabs ---------- */
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid var(--line);margin:14px -16px 0;padding:0 16px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{
  border:0;background:none;padding:10px 12px;font-size:14px;color:var(--ink3);
  border-bottom:2px solid transparent;white-space:nowrap;cursor:pointer;margin-bottom:-1px
}
.tab[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}

/* ---------- 表格 ---------- */
.tablewrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--card)}
table{border-collapse:collapse;width:100%;font-size:14px}
th,td{padding:9px 11px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}
th{background:#FBF8F2;font-weight:600;font-size:12.5px;color:var(--ink2);white-space:nowrap}
tr:last-child td{border-bottom:0}
td.en,th.en{font-family:var(--en);font-size:15px}
td .cn{color:var(--ink3);font-size:13px}

/* ---------- 单词卡 ---------- */
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:420px){.grid2{grid-template-columns:1fr}}
.wordcard{
  background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:14px;
  cursor:pointer;min-height:96px;display:flex;flex-direction:column;justify-content:space-between
}
.wordcard .w{font-family:var(--en);font-size:22px;font-weight:600;letter-spacing:.01em}
.wordcard .p{font-size:12px;color:var(--ink3);margin-top:2px}
.wordcard .c{font-size:13.5px;color:var(--ink2);margin-top:8px;opacity:0}
.wordcard.on .c{opacity:1}
.wordcard .spk{align-self:flex-end;font-size:12px;color:var(--accent)}

/* ---------- 答题 ---------- */
.quizbar{height:3px;background:var(--line);border-radius:2px;overflow:hidden;margin:14px 0 4px}
.quizbar i{display:block;height:100%;background:var(--accent);transition:width .25s}
.qmeta{display:flex;justify-content:space-between;font-size:12px;color:var(--ink3);letter-spacing:.03em;margin:10px 0 14px}
.qmeta .src{color:var(--gold)}
.stem{
  font-family:var(--en);font-size:19px;line-height:1.65;white-space:pre-wrap;
  margin:0 0 16px;color:var(--ink)
}
.stem .cnq{font-family:var(--zh);font-size:13.5px;color:var(--ink3);display:block;margin-top:4px;line-height:1.5}
details.ctx{border:1px solid var(--line);border-radius:var(--r-sm);background:#FCFAF5;margin-bottom:14px}
details.ctx summary{padding:9px 12px;cursor:pointer;font-size:13px;color:var(--ink2);font-weight:600}
details.ctx .body{padding:0 14px 12px;font-family:var(--en);font-size:15px;line-height:1.75;white-space:pre-wrap;color:var(--ink)}
details.ctx[open] summary{border-bottom:1px solid var(--line);margin-bottom:10px}

.opts{display:flex;flex-direction:column;gap:8px}
.opt{
  display:flex;align-items:flex-start;gap:12px;width:100%;text-align:left;
  background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:11px 13px;
  cursor:pointer;min-height:48px
}
.opt:hover{border-color:var(--ink3)}
.opt .lt{
  font-family:var(--en);font-size:14px;font-weight:600;width:24px;height:24px;flex-shrink:0;
  border:1px solid var(--line2);border-radius:6px;display:flex;align-items:center;justify-content:center;
  color:var(--ink2);margin-top:1px
}
.opt .tx{font-family:var(--en);font-size:16px;line-height:1.5}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .lt{background:var(--accent);border-color:var(--accent);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-soft)}
.opt.ok .lt{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-soft)}
.opt.bad .lt{background:var(--bad);border-color:var(--bad);color:#fff}
.opt[disabled]{cursor:default}

.field{margin-top:14px}
.field input{
  width:100%;font-family:var(--en);font-size:18px;padding:11px 13px;
  border:1px solid var(--line2);border-radius:12px;background:var(--card);color:var(--ink)
}
.field input:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.field textarea{
  width:100%;min-height:74px;font-family:var(--en);font-size:17px;padding:11px 13px;line-height:1.5;
  border:1px solid var(--line2);border-radius:12px;background:var(--card);color:var(--ink);resize:vertical
}
.field textarea:focus{outline:2px solid var(--accent-soft);border-color:var(--accent)}
.hintline{font-size:12px;color:var(--ink3);margin-top:6px}

.passage{font-family:var(--en);font-size:16px;line-height:2;white-space:pre-wrap}
.passage input{
  width:96px;font-family:var(--en);font-size:15px;padding:2px 6px;margin:0 3px;
  border:0;border-bottom:1.5px solid var(--ink3);border-radius:0;background:transparent;text-align:center
}
.passage input:focus{outline:0;border-bottom-color:var(--accent);background:var(--accent-soft)}
.passage input.ok{border-bottom-color:var(--ok);color:var(--ok)}
.passage input.bad{border-bottom-color:var(--bad);color:var(--bad)}

.fb{border:1px solid var(--line);border-radius:var(--r);background:var(--card);margin-top:18px;overflow:hidden}
.fb .head{padding:11px 14px;font-weight:700;font-size:14.5px;display:flex;justify-content:space-between;align-items:center}
.fb.ok .head{background:var(--ok-soft);color:var(--ok)}
.fb.bad .head{background:var(--bad-soft);color:var(--bad)}
.fb .body{padding:4px 14px 14px}
.fb dl{margin:10px 0 0;display:grid;grid-template-columns:56px 1fr;gap:8px 10px;font-size:14px}
.fb dt{color:var(--ink3);font-size:12.5px;letter-spacing:.04em;padding-top:2px}
.fb dd{margin:0;color:var(--ink2);line-height:1.65}
.fb dd.en{font-family:var(--en);font-size:15.5px;color:var(--ink)}
.fb .acts{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}

/* ---------- 底部导航 ---------- */
nav.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:30;background:rgba(247,243,236,.97);
  border-top:1px solid var(--line2);padding:6px 8px calc(6px + env(safe-area-inset-bottom));
  display:flex;justify-content:space-around;max-width:760px;margin:0 auto
}
nav.tabbar button{
  flex:1;background:none;border:0;padding:7px 2px;font-size:11.5px;color:var(--ink3);
  display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer;min-height:50px
}
nav.tabbar button .gl{font-size:17px;line-height:1}
nav.tabbar button[aria-current="true"]{color:var(--accent);font-weight:600}
nav.tabbar button .dot{width:4px;height:4px;border-radius:2px;background:transparent}
nav.tabbar button[aria-current="true"] .dot{background:var(--accent)}

/* ---------- 讲评/统计 ---------- */
.statline{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14px}
.statline:last-child{border-bottom:0}
.statline .bar{grid-column:1 / -1;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.statline .bar i{display:block;height:100%;background:var(--accent)}
.statline .bar.low i{background:var(--bad)}
.scorebig{font-family:var(--en);font-size:30px;font-weight:600}

.kv{display:grid;grid-template-columns:84px 1fr;gap:10px;font-size:14px;padding:7px 0;border-bottom:1px dashed var(--line)}
.kv:last-child{border-bottom:0}
.kv .k{color:var(--ink3);font-size:12.5px}
.fval{font-family:var(--en);font-size:15.5px;line-height:1.6;color:var(--accent);padding:2px 0}

.prow{padding:12px 0;border-bottom:1px dashed var(--line)}
.prow:last-child{border-bottom:0}
.prow .ph{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.prow .pn{font-weight:600;font-size:14.5px;line-height:1.4}
.prow .pv{font-family:var(--en);font-size:13px;color:var(--accent);white-space:nowrap}
.prow .pd{font-size:13.5px;color:var(--ink2);margin-top:3px;line-height:1.6}
.prow .pq{font-size:11.5px;color:var(--ink3);margin-top:4px}

.stepline{display:grid;grid-template-columns:38px 1fr;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line)}
.stepline:last-child{border-bottom:0}
.stepline .n{font-family:var(--en);font-size:20px;color:var(--accent);font-weight:600}
.stepline .t{font-weight:600;font-size:14.5px}
.stepline .d{font-size:13.5px;color:var(--ink2);margin-top:2px}

.note{background:var(--gold-soft);border:1px solid #E8D6B4;border-radius:var(--r-sm);padding:11px 13px;font-size:13.5px;color:#6B4A16;line-height:1.6}
.note b{color:#523506}

.empty{text-align:center;padding:40px 18px;color:var(--ink3)}
.empty .big{font-size:30px;font-family:var(--en);color:var(--line2);margin-bottom:8px}

footer.colophon{margin-top:34px;padding-top:14px;border-top:1px solid var(--line);font-size:12px;color:var(--ink3);line-height:1.7}

@media print{
  nav.tabbar,header.top,.btn,.btnrow,.quizbar,.tabs{display:none!important}
  body{background:#fff}
  .app{max-width:none;padding:0}
  .panel,.rowlist{box-shadow:none;break-inside:avoid}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">
      <span class="kicker">译林版（三起）· 六年级上册 · 2026 秋</span>
      <h1>英语练习台 <small>U1–U8 · 真题 + 变式</small></h1>
    </div>
    <div class="top-right">
      <span class="chip accent" id="verChip">离线可用</span>
    </div>
  </header>
  <main id="view"></main>
</div>
<nav class="tabbar" id="nav" aria-label="主导航">
  <button data-nav="home" aria-current="true"><span class="gl">✎</span>练习<span class="dot"></span></button>
  <button data-nav="know"><span class="gl">▤</span>知识<span class="dot"></span></button>
  <button data-nav="fab"><span class="gl">∞</span>变式<span class="dot"></span></button>
  <button data-nav="errors"><span class="gl">✓</span>错题<span class="dot"></span></button>
  <button data-nav="teach"><span class="gl">▦</span>讲评<span class="dot"></span></button>
</nav>
<script>/* 译林版（三起）六年级上册 2026 秋 · 单元知识库
   来源标注：
   full  = 教材+教师资料包（U2/U3，最准）
   test  = 公开单元卷/课件（U1/U4/U5）
   theme = 按单元主题与教参整理（U6/U7/U8，词汇请以课本词汇表为准） */
const UNITS = [
{
  id: 'u1', no: 'U1', title: 'Try your best', cn: '全力以赴', theme: '梦想与职业', src: 'test',
  words: [
    ['pilot','n.','飞行员'],['doctor','n.','医生'],['nurse','n.','护士'],['writer','n.','作家'],
    ['singer','n.','歌手'],['dancer','n.','舞蹈演员'],['player','n.','运动员；选手'],['farmer','n.','农民'],
    ['driver','n.','司机'],['policeman','n.','警察（复 policemen）'],['cook','n./v.','厨师；烹饪'],
    ['worker','n.','工人'],['dream','n.','梦想'],['future','n.','未来'],['best','adj./adv.','最好的'],
    ['hard','adv./adj.','努力地；困难的'],['plane','n.','飞机'],['sick','adj.','生病的'],['hospital','n.','医院']
  ],
  phrases: [
    ['try one\'s best','尽某人最大努力'],['be good at doing sth','擅长做某事'],['have a try','试一试'],
    ['want to be','想要成为'],['make one\'s dream come true','让梦想成真'],['work hard','努力工作/学习'],
    ['help sick people','帮助生病的人'],['in the future','在未来'],['give up','放弃'],['of course','当然']
  ],
  patterns: [
    {en:'What do you want to be? — I want to be a pilot.', cn:'你想成为什么？——我想当飞行员。', note:'问职业理想，答 want to be + a/an + 职业'},
    {en:'What does your father do? — He is a doctor.', cn:'你爸爸做什么工作？——他是医生。', note:'问职业两种问法：What do you do? / What do you want to be?'},
    {en:'She is good at drawing.', cn:'她擅长画画。', note:'at 是介词，后面动词加 -ing'},
    {en:'You should try your best.', cn:'你应该尽最大努力。', note:'should + 动词原形，表建议'},
    {en:'Then you can make your dream come true.', cn:'那样你就能让梦想成真。', note:'make + 宾语 + 形容词/动词原形'}
  ],
  grammar: [
    {t:'be good at + 动词-ing', f:'主语 + be good at + doing', eg:'He is good at swimming.', warn:'at 是介词 → 动词必须 -ing（× good at draw）'},
    {t:'want to be + 职业', f:'主语 + want to be + a/an + 职业名词', eg:'I want to be a writer.', warn:'元音音素前用 an：an artist / an engineer'},
    {t:'职业名词后缀', f:'动词/名词 + -er/-or/-ist', eg:'teach→teacher, write→writer, sing→singer, dance→dancer, play→player, drive→driver, farm→farmer', warn:'policeman 复数是 policemen；cook 既是动词也是“厨师”'},
    {t:'should + 动词原形', f:'主语 + should + 动词原形', eg:'You should study hard.', warn:'should 后永远原形，不加 to、不加 -s'},
    {t:'一般过去时（复习）', f:'主语 + 动词过去式', eg:'He asked me for help.', warn:'U1 已开始出现过去时叙述，为 U2 做铺垫'}
  ],
  traps: [
    'be good at draw × → be good at drawing √',
    'I want to be pilot. × → I want to be a pilot. √',
    'He should to try his best. × → He should try his best. √',
    'make my dream come true（come 不加 comes）',
    'policeman 的复数是 policemen，不是 policemans'
  ]
},
{
  id: 'u2', no: 'U2', title: 'Honesty', cn: '诚实', theme: '诚实与勇气', src: 'full',
  words: [
    ['honesty','n.','诚实；正直'],['honest','adj.','诚实的'],['lie','n./v.','谎言；说谎'],
    ['truth','n.','真相；事实'],['storybook','n.','故事书'],['diary','n.','日记'],['entry','n.','（日记的）一则'],

  function buildUnitQueue(uid, size) {

    if (b.length) {
      out = shuffle(b).slice(0, Math.min(b.length, size - Math.ceil(size / 3)));
      // 语篇题保持顺序
      out.sort(function (x, y) {
        if (x.ctx && y.ctx && x.ctx === y.ctx) return x.id.localeCompare(y.id);
        return 0;
      });
    }
    while (out.length < size) {
      var t = tags[Math.floor(Math.random() * tags.length)];
      out.push(CORE.generate(t));
    }
    return out.slice(0, size);
  }

  /* ---------------- 答题 ---------------- */
  function renderQuiz() {
    var q = S.q;
    if (!q) return '<p>没有题目</p>';
    var it = q.items[q.i];
    if (!it) return renderResult();
    var h = '';
    h += '<div class="quizbar"><i style="width:' + Math.round((q.i) / q.items.length * 100) + '%"></i></div>';

      '<span class="src">' + esc(it.src || (it.gen ? '变式 · ' + (CORE.GENS[it.tag] ? CORE.GENS[it.tag].label : '') : '')) + '</span></div>';

    if (it.ctx && PASSAGES[it.ctx]) {

          } else if (q.pick === letter(i)) cls += ' sel';
          h += '<button class="' + cls + '" data-act="pick" data-id="' + letter(i) + '"' + (q.submitted ? ' disabled' : '') + '>' +
            '<span class="lt">' + letter(i) + '</span><span class="tx">' + esc(o) + '</span></button>';
        });
        h += '</div>';
      } else if (it.kind === 'text') {
        h += '<div class="field"><textarea id="ansInput" placeholder="写出完整句子，标点可省略" ' + (q.submitted ? 'disabled' : '') + '>' + esc(q.input) + '</textarea>' +
          '<div class="hintline">大小写、句末标点不严格扣分；didn\'t 与 did not 都算对。</div></div>';

  function fmtStem(s) {
    var parts = String(s).split('\n');
    var out = esc(parts[0]);
    for (var i = 1; i < parts.length; i++) out += '<span class="cnq">' + esc(parts[i]) + '</span>';
    return out;
  }

  function renderPassage(text, q) {
    var out = '', last = 0, re = /_{2,}\s*\((\d+)\)/g, m;
    while ((m = re.exec(text)) !== null) {
      var n = m[1];
      out += esc(text.slice(last, m.index));
      var val = q && q.multiIn ? (q.multiIn[n] || '') : '';
      var cls = q && q.multiOk ? (q.multiOk[n] ? ' class="ok"' : ' class="bad"') : '';
      var dis = q ? ' disabled' : '';
      out += '<input data-blank="' + n + '" autocomplete="off" spellcheck="false" aria-label="第' + n + '空" value="' + esc(val) + '"' + cls + dis + '>';
      last = m.index + m[0].length;
    }
    out += esc(text.slice(last));
    return out;
  }

  function renderFeedback(it, ok) {
    var h = '<div class="fb ' + (ok ? 'ok' : 'bad') + '"><div class="head"><span>' + (ok ? '✓ 正确' : '✗ 再想一步') + '</span>' +

      h += '<dt>正确答案</dt><dd class="en">' + esc(displayAnswer(it)) + '</dd>';

    h += '<dt>考点</dt><dd>' + esc(it.point) + '</dd>';

        h += '<dt>错空解析</dt><dd><ul style="margin:0;padding-left:18px">' + blanks.map(function (b) {

  /* ---------------- 提交 ---------------- */
  function submitAnswer() {
    var q = S.q, it = q.items[q.i];
    if (!it || q.submitted) return;
    var ok = false;
    if (it.kind === 'choice') {
      if (!q.pick) { toast('先选一个选项'); return; }
      ok = CORE.check(it, q.pick);
    } else if (it.kind === 'multi') {
      var inputs = document.querySelectorAll('#passageBox input');
      var all = true; q.multiOk = {}; q.multiIn = {};
      inputs.forEach(function (inp) {
        var n = inp.getAttribute('data-blank');
        var b = null;
        it.blanks.forEach(function (x) { if (String(x.n) === String(n)) b = x; });
        var good = b ? CORE.check({ answer: b.answer }, inp.value) : false;
        q.multiOk[n] = good; q.multiIn[n] = inp.value;
        inp.classList.add(good ? 'ok' : 'bad');
        inp.disabled = true;
        if (!good) all = false;
      });
      ok = all;
    } else {
      var el = document.getElementById('ansInput');
      q.input = el ? el.value : q.input;
      if (!String(q.input).trim()) { toast('先写下答案'); return; }
      ok = CORE.check(it, q.input);
    }
    q.ok = ok; q.submitted = true;
    q.res[q.i] = ok;
    record(it, ok);
    render();
    var fb = document.querySelector('.fb');
    if (fb) fb.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  }

    var q = S.q;

    else if (act === 'variant') {
      var it = S.q.items[S.q.i];
      var n = parseInt(el.getAttribute('data-n') || '3', 10);
      var vs = CORE.variants(it, n);
      startQuiz(vs, '同类变式 · ' + (CORE.GENS[it.tag] ? CORE.GENS[it.tag].label : it.point), 'variant');
    }
    else if (act === 'again') {
      var k = S.q.key || '';
      if (k.indexOf('unit:') === 0) startQuiz(buildUnitQueue(k.split(':')[1], 12), S.q.title, k);
      else if (k === 'bank') startQuiz(buildBankQueue(), S.q.title, k);
      else if (k.indexOf('fab:') === 0) { var t = k.split(':')[1], a2 = []; for (var j = 0; j < 10; j++) a2.push(CORE.generate(t)); startQuiz(a2, S.q.title, k); }
      else if (k === 'errors') { var l2 = Object.keys(DB.wrong).map(function (x) { return DB.wrong[x].item; }).filter(Boolean); if (l2.length) startQuiz(l2, S.q.title, k); }
      else { S.view = 'home'; render(); }
    }
    else if (act === 'retry-wrong') {
      var wrongs = S.q.items.filter(function (x, i) { return S.q.res[i] === false; });
      if (wrongs.length) startQuiz(wrongs, '重做错题 · ' + S.q.title, 'retry');
    }
    else if (act === 'errors') { S.view = 'errors'; render(); window.scrollTo(0, 0); }
    else if (act === 'kunit') { S.unit = id; S.tab = 'grammar'; S.view = 'unit'; render(); window.scrollTo(0, 0); }
    else if (act === 'redo-wrong') {
      var list = Object.keys(DB.wrong).map(function (k) { return DB.wrong[k].item; }).filter(Boolean);
      if (list.length) startQuiz(list, '错题本 · 全部重做', 'errors');
    }
    else if (act === 'know') { S.view = 'know'; render(); window.scrollTo(0, 0); }
    else if (act === 'map') { S.view = 'map'; render(); window.scrollTo(0, 0); }
    else if (act === 'pack') { S.view = 'pack'; render(); window.scrollTo(0, 0); }
    else if (act === 'teach') { S.view = 'teach'; render(); window.scrollTo(0, 0); }
    else if (act === 'go-last') {
      if (DB.last && DB.last.key && DB.last.key.indexOf('unit:') === 0) {
        S.unit = DB.last.key.split(':')[1];
        startQuiz(buildUnitQueue(S.unit, 12), unitName(S.unit) + ' · 一组合练', DB.last.key);
      } else { S.view = 'home'; render(); }
    }
    else if (act === 'speak') { speak(id); }
    else if (act === 'dict') { startDict(id); }
    else if (act === 'play') { speak(S.dict.list[S.dict.i][0]); }
    else if (act === 'dict-hint') {
      var w = S.dict.list[S.dict.i][0];
      var inp = document.getElementById('dictInput');
      if (inp) { inp.value = w.slice(0, 1) + '…'; }
    }
    else if (act === 'dict-submit') {
      var d = S.dict, word = d.list[d.i][0];
      var vi = document.getElementById('dictInput');
      var val = vi ? vi.value.trim() : '';
      if (!val) { toast('先写下你听到的单词'); return; }
      d.input = val; d.ok = CORE.norm(val) === CORE.norm(word);
      d.res[d.i] = d.ok;
      render();
    }
    else if (act === 'dict-next') {
      var d2 = S.dict;
      if (d2.i + 1 >= d2.list.length) { d2.stage = 'done'; render(); window.scrollTo(0, 0); return; }
      d2.i++; d2.input = ''; d2.ok = null; render(); speak(d2.list[d2.i][0]);
    }
    else if (act === 'export') { exportData(); }
    else if (act === 'import') { importData(); }
    else if (act === 'wipe') { wipe(); }
    else if (act === 'print') { window.print(); }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Enter') return;
    if (S.view === 'quiz') {
      e.preventDefault();
      if (S.q && S.q.items && S.q.items[S.q.i]) {
        if (S.q.submitted) nextQ(); else submitAnswer();
      }
    } else if (S.view === 'dict' && S.dict && S.dict.stage !== 'done') {
      var tag = (e.target.tagName || '').toLowerCase();
      if (tag === 'input') {
        e.preventDefault();
        if (S.dict.ok !== null) { /* wait for next */ } else {
          var btn = document.querySelector('[data-act="dict-submit"]');
          if (btn) btn.click();
        }
      }
    }
  });

  document.addEventListener('input', function (e) {
    if (e.target && e.target.id === 'ansInput') { S.q.input = e.target.value; }
    if (e.target && e.target.id === 'dictInput') { S.dict.input = e.target.value; }
  });

  /* ---------------- 备份 ---------------- */
  function exportData() {
    var blob = new Blob([JSON.stringify({ app: 'yl6a', ts: Date.now(), db: DB }, null, 1)], { type: 'application/json' });
    var a = document.createElement('a');
    var d = new Date();
    a.href = URL.createObjectURL(blob);
    a.download = '六上英语练习台_备份_' + d.getFullYear() + ('0' + (d.getMonth() + 1)).slice(-2) + ('0' + d.getDate()).slice(-2) + '.json';
    document.body.appendChild(a); a.click();
    setTimeout(function () { URL.revokeObjectURL(a.href); a.remove(); }, 500);
    toast('已导出备份');
  }

  function importData() {
    var inp = document.createElement('input');
    inp.type = 'file'; inp.accept = '.json,application/json';
    inp.onchange = function () {
      var f = inp.files[0]; if (!f) return;
      var r = new FileReader();
      r.onload = function () {
        try {
          var obj = JSON.parse(r.result);
          var db = obj.db || obj;
          if (!db || !db.log) throw new Error('格式不对');
          Object.keys(db.log || {}).forEach(function (k) {
            var a = DB.log[k] || (DB.log[k] = { n: 0, ok: 0 });
            a.n = Math.max(a.n || 0, db.log[k].n || 0);
            a.ok = Math.max(a.ok || 0, db.log[k].ok || 0);
            a.tag = a.tag || db.log[k].tag; a.point = a.point || db.log[k].point; a.unit = a.unit || db.log[k].unit;
          });
          Object.keys(db.wrong || {}).forEach(function (k) {
            if (!DB.wrong[k]) DB.wrong[k] = db.wrong[k];
            else { DB.wrong[k].n = Math.max(DB.wrong[k].n || 0, db.wrong[k].n || 0); DB.wrong[k].fixed = Math.max(DB.wrong[k].fixed || 0, db.wrong[k].fixed || 0); }
          });
          Object.keys(db.daily || {}).forEach(function (k) {
            var a = DB.daily[k] || (DB.daily[k] = { n: 0, ok: 0 });
            a.n = Math.max(a.n || 0, db.daily[k].n || 0); a.ok = Math.max(a.ok || 0, db.daily[k].ok || 0);
          });
          save(); toast('已合并导入'); render();
        } catch (err) { toast('这个文件读不了'); }
      };
      r.readAsText(f);
    };
    inp.click();
  }

  function wipe() {
    if (!confirm('清空这台设备上的全部练习记录？建议先导出备份。')) return;
    DB = baseDB(); save(); S.view = 'home'; render(); toast('已清空');
  }

  /* ---------------- 导航 ---------------- */
  nav.addEventListener('click', function (e) {
    var b = e.target.closest('[data-nav]');
    if (!b) return;
    var n = b.getAttribute('data-nav');
    S.view = n; render(); window.scrollTo(0, 0);
  });

  /* 调试钩子：便于以后扩展/自测（不影响使用） */
  window.__APP = { S: S, render: render, startQuiz: startQuiz, bankOf: bankOf, units: UNITS, bank: BANK };

  render();
})();
</script>
</body>
</html>
